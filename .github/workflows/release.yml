# Publishes to npm with provenance attestation.
#
# Setup (one-time): create an npm automation token and add it to the repo
# as the NPM_TOKEN secret. Then trigger this workflow manually from the
# Actions tab after bumping the version.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + lint + tests)
        run: npm run verify

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
